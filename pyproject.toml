[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issuepilot"
version = "0.1.0"
description = "Open-source GitHub issue triage and maintenance bot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IssuePilot contributors" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "build>=1,<2"]

[project.scripts]
issuepilot = "issuepilot.cli:main"

[tool.setuptools.packages.find]
include = ["issuepilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
